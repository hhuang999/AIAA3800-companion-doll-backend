id: kind_self_talk
name: 把全盘苛责换回平实的说法
status: enabled
requires_permission: true
targets:
  pressure_types:
  - self
  - social_evaluative
  pathways:
  - self_criticism
constraints:
  excluded_emotion_intensities:
  - high
  excluded_readiness:
  - low
reasoner:
  when_any: &id001
  - 用户出现把一次考砸或失手等同于“整个人都不行”的自我苛责
  - 用户愿意试着松动那句太狠的自我评价，且未处于现实欺凌威胁下
  not_when:
  - 用户正在遭受现实欺凌、辱骂或人身威胁时，绝不把外部伤害归因到自我想法
  - 当前只想倾诉委屈或明确拒绝换说法时，保留纯粹倾听
  success: 用户说出一句更具体、贴近事实的话，或明确表示不需要这个视角
  exit: 用户说停、觉得鸡汤、不舒服或只想说说时立即退出
talker:
  steps:
  - 接住那句狠话背后的难受，把“这次没拿稳”和“我整个人很差”轻柔拆开，不评价能力高低。
  - 借“如果是好朋友遇到这事，你会怎么跟他说”邀用户换一句平实、对得上事实的话，绝不强行正能量。
  - 接受用户自己定下的版本，也可以觉得暂时不想换，直接就此停住。
  examples:
  - “这科没考顺”跟“我整个人废了”，其实差着很大一截呢。
  - 要是好朋友这次同样考砸了来找你，你会觉得他整个人都不行吗？
  never_say:
  - 你就是最棒的
  - 你已经做得很好了
  - 一切都会好的
  - 你不胖
limits:
  per_session: 1
emo: 🙂
source:
  document: 课程内容包 course-2.0（初高中升学陪伴）
  verification: codex_source_checked
  evidence: companion/docs/autonomous-upgrade/research/研究链-v3.md
protocol:
  version: course-2.0
  adaptation: 中文青少年去苛责短步骤改编；依据完美主义担忧元分析与青少年正念自我关怀研究。
  burden: 最多三轮，绝不灌输空洞鸡汤或强迫乐观肯定。
  permission: 先问是否愿意一起把对自己的狠话放平实一点，经明确同意后再开始。
  invitation: 刚考完最容易跟自己过不去，想不想试试换句像对好朋友那样、更贴近事实的话？
  stop: 用户反感鸡汤感、只想吐槽或喊停时，当场结束步骤回到倾听。
  followup: 仅记下用户愿意保留的事实视角，不把单次改写当成长期自尊改善。
  feedback_limits: 仅记录用户明确说出的有用或无用反馈，不从沉默推断赞同。
  mechanism: 将单一事件失手与整体自我价值剥离，借对待朋友的平实标准松动双重苛责。
  evidence_ids:
  - E07
  - E09
  minimum_information:
  - 用户刚说出的具体自我苛责或失望点
  prerequisites: *id001
  excluded_contexts:
  - unsafe_relationship
  keywords:
  - 考砸
  - 不行
  - 废了
  - 没用
  - 完美
  - 自责
  - 不够好
  counterexample: 当痛苦源于同学当面嘲讽或校园欺凌，绝不诱导学生“自我调节”，转为安全支持或倾听。
  required_contexts: []
  legacy_ids: []
