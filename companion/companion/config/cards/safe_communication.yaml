id: safe_communication
name: 顺一句低压力的沟通说法
status: enabled
requires_permission: true
targets:
  pressure_types:
  - relationship
  pathways: []
constraints:
  excluded_emotion_intensities:
  - high
  excluded_readiness:
  - low
reasoner:
  when_any: &id001
  - 与同伴、室友或相对安全师长存在具体误会或沟通卡点
  - 用户明确判断对方相对安全（safe_contact）且主动想试试表达
  not_when:
  - 对方安全性不明或涉及欺凌、威胁、报复风险时严格禁用
  - 父母单向比较压力且用户不想沟通时，改用 expectation_boundary
  success: 用户一起顺出一条口语自然、不拧巴的话，自行决定用还是不用
  exit: 用户犹豫安全性、不想说、或说算了时立即停下
talker:
  steps:
  - 确认对方确实安全、自己也想沟通，绝不催着用户去谈。
  - 不用死板套路，顺着少年日常说话习惯拟一句“刚才怎么了 + 我希望这样行不行”的短句。
  - 明确说出这句话留着备用就行，用户想改、删掉或干脆不发都可以。
  examples:
  - 要是觉得安全，其实就发一句：“昨天我没看手机才让你干等的，不是故意不理你，今晚还能聊聊不？”
  never_say:
  - 你必须去道歉
  - 你直接当面对质
  - 父母都是为你好
limits:
  per_session: 1
emo: 🤔
source:
  document: 课程内容包 course-2.0（初高中升学陪伴）
  verification: codex_source_checked
  evidence: companion/docs/autonomous-upgrade/research/研究链-v3.md
protocol:
  version: course-2.0
  adaptation: 去八股化口语沟通短步骤；依据青少年人际支持综述中的低负担表达与 IPT-A 沟通分析机制。
  burden: 只草拟一到两句日常短表达，不代做关系判断或替用户发送。
  permission: 核实对象相对安全且用户确有沟通意愿后再问许可。
  invitation: 既然觉得对方相对安全、你也想把话摊开，要不要一起顺一句低压力、好开口的话？
  stop: 一旦用户觉得不安全、没把握或不想发，即刻停下并收回草稿。
  followup: 仅记用户自己提及的后续感受，绝不默认“已经和好或联系过”。
  feedback_limits: 草拟表达仅供备用，不等价于对方一定会配合或关系改善。
  mechanism: 在确认人身与情绪安全前提下，用低攻击性的平实日常口语降低误会沟通门槛。
  evidence_ids:
  - E10
  - E05
  minimum_information:
  - 对方相对安全（safe_contact）以及想澄清的核心误会
  prerequisites: *id001
  excluded_contexts:
  - unsafe_relationship
  - no_private_space
  - bedtime
  keywords:
  - 吵架
  - 误会
  - 解释
  - 同桌
  - 室友
  - 沟通
  - 开口
  counterexample: 校园排挤或家长惩罚威胁场景严禁套用此卡，不得劝和。
  required_contexts:
  - safe_contact
  legacy_ids: []
