id: safe_support
name: 挑一个让你放心的现实支持入口
status: enabled
requires_permission: true
targets:
  pressure_types:
  - relationship
  - academic
  - social_evaluative
  - future
  - self
  pathways:
  - loneliness
constraints:
  excluded_emotion_intensities:
  - high
  excluded_readiness:
  - low
reasoner:
  when_any: &id001
  - 感到孤立硬扛、怕丢脸、怕保密不住或怕添麻烦而不敢向现实人求助
  - 愿意在不被强迫前提下想想有什么安全的出口
  not_when:
  - 明确拒绝联系任何人，或处于睡前休息状态时停止推进
  - 危急人身风险走独立安全路径，不用此日常入口代替
  success: 用户说清自己最顾虑的一点，由本人自己挑出（或决定暂不挑）一个放心的人/渠道与透露尺度
  exit: 用户说不想找人、太麻烦或说停时立刻尊重并停下
talker:
  steps:
  - 先接住“怕被评价/怕泄密/怕添乱”这些真顾虑，绝不默认父母或老师一定安全、也不承诺绝对保密。
  - 请用户自己盘一下身边相对放心、不会随口评判的人或学校心理老师/靠谱长辈；没有也不用勉强。
  - 可选留一句只讲两成细节的轻量开头，随时有权决定今天不联系。
  examples:
  - 怕对方回头就说教或到处传，本来就会让人不敢开口。
  - 如果只跟信得过的人先说“最近考前有点扛不住，想你先听我说会儿”，会不会轻松些？
  never_say:
  - 只有我懂你
  - 你必须告诉家长
  - 老师一定能保密
  - 我已经帮你联系好了
limits:
  per_session: 1
emo: 🙂
source:
  document: 课程内容包 course-2.0（初高中升学陪伴）
  verification: codex_source_checked
  evidence: companion/docs/autonomous-upgrade/research/研究链-v3.md
protocol:
  version: course-2.0
  adaptation: 降门槛现实连接短步骤；依据中国中学生求助结构研究与青少年求助障碍综述、PFA 连接原则。
  burden: 只拆最大的一个顾虑和最小一个透露口子，不强求立刻见面。
  permission: 明确询问是否愿意一起盘盘求助顾虑，完全由用户做主。
  invitation: 一个人硬扛确实太沉了，要不要只先挑最顾虑的一点，或想想谁是相对放心的说话对象？
  stop: 用户说今天还是只想自己待着，直接回到安静陪伴。
  followup: 绝不主动替用户记录未发生的联系事实。
  feedback_limits: 仅记录用户自己选择或放弃的考量，不把“聊过入口”算成已完成求助。
  mechanism: 显式拆解丢脸、保密与添麻烦等求助阻力，把选谁和讲多少的控制权完全交还学生。
  evidence_ids:
  - E04
  - E05
  - E13
  minimum_information:
  - 求助时最担心的阻碍或是否想要找人搭把手
  prerequisites: *id001
  excluded_contexts:
  - bedtime
  keywords:
  - 孤独
  - 孤单
  - 一个人
  - 怕丢脸
  - 添麻烦
  - 不敢说
  - 谁能帮
  - 硬扛
  - 求助
  counterexample: 严禁宣称“只有玩偶懂你”，也严禁强制规定必须告诉父母。
  required_contexts: []
  legacy_ids: []
