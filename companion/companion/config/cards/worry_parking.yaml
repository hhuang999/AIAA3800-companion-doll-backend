id: worry_parking
name: 睡前把一件担心先存我这儿
status: enabled
requires_permission: true
targets:
  pressure_types: []
  pathways:
  - sleep
  - rumination
constraints:
  excluded_emotion_intensities:
  - high
  excluded_readiness:
  - low
reasoner:
  when_any: &id001
  - 用户处于夜深或睡前（bedtime），脑子停不下来还在琢磨明天的学习或考试
  - 用户愿意把一件事先搁在这里、短收尾去睡
  not_when:
  - 非睡前场景不强行要求“晚安结束”
  - 严重慢性失眠不做医疗性睡眠限制规则指导
  success: 用一句话把最挂心的事暂存好，温暖短收尾让用户安心放下手机去休息
  exit: 用户不愿存或想直接闭眼睡，一句话说晚安结束，绝不拖长对话
talker:
  steps:
  - 只帮用户接住今晚最放不下的一句话存着，绝不拉清单、不趁机教解题或排计划。
  - 温和复述这句存放内容并简短道晚安收尾，把剩下的时间交回给休息。
  examples:
  - 明早物理那张卷子先搁我这儿盯着，今晚脑子不用再反复过它了，安心闭眼歇会儿。
  never_say:
  - 你必须马上睡着
  - 我整晚陪你聊到困为止
  - 把明天的五件事全列出来
limits:
  per_session: 1
emo: 😌
source:
  document: 课程内容包 course-2.0（初高中升学陪伴）
  verification: codex_source_checked
  evidence: companion/docs/autonomous-upgrade/research/研究链-v3.md
protocol:
  version: course-2.0
  adaptation: 中文初高中晚自习后睡前卸载短步骤；依据睡前认知卸载书写研究（Scullin 等, 2018）与学业-睡眠纵向中介研究。
  burden: 两步短收尾，坚决不把睡前对话拉长成新的思维反刍。
  permission: 询问是否愿意把这件明天再管的担心先存玩偶这儿，同意即两句收尾。
  invitation: 夜深了先别和明天的事硬耗着，愿不愿意把最惦记的一件先存我这儿，安心歇会儿？
  stop: 用户不想存或直接说睡了，马上温柔收尾不追问。
  followup: 次日仅在用户主动问起时再提这件暂存担心。
  feedback_limits: 不承诺一定帮助快速入睡，仅支持睡前卸载思绪边界。
  mechanism: 将睡前反复盘旋的未完成担忧具体外化封存一句，减少睡前工作记忆唤醒并直接收尾休息。
  evidence_ids:
  - E12
  - E02
  minimum_information:
  - 当前处于睡前时段且用户有挂念明日的心事
  prerequisites: *id001
  excluded_contexts:
  - unsafe_relationship
  keywords:
  - 睡不着
  - 失眠
  - 睡前
  - 晚自习
  - 熬夜
  - 明早
  - 躺下
  - 闭眼
  counterexample: 严禁在睡前诱导做复杂计划、生涯探索（values_exploration）或长对话挽留。
  required_contexts:
  - bedtime
  legacy_ids: []
