id: breathing_60s
name: 自然呼吸小暂停
status: enabled
emo: 😌
lines:
- text: 先找一个舒服不费劲的姿势，眼睛不用刻意闭上。
  pause_s: 2
- text: 不用特意深呼吸，也不用数拍子，让它照原本的样子走。
  pause_s: 3
- text: 就轻轻松松留意一进一出这一下的感觉。
  pause_s: 5
- text: 哪里觉得别扭就随时停，看看桌边什么小物件也行。
  pause_s: 3
- text: 好了，先慢下来陪你歇到这儿。
  pause_s: 0
protocol:
  version: course-2.0
  goal: 短暂停下半分钟留意当下自然呼吸，放慢紧绷节奏而不强行控息
  evidence_ids:
  - E16
  prerequisites:
  - 愿意停下半分钟试一试，且当前可安全暂停
  - 没有聚焦身体或呼吸引发的不适
  excluded_contexts:
  - body_focus_distress
  - unsafe_relationship
  invitation: 要不要先花半分钟顺着自然呼吸停一下？不用刻意深呼吸，随时喊停都行。
  stop: 听到拒绝、喊停、新话题或风险信号立刻收住，不自动续播。
  feedback_limits: 完成播报仅代表片段走完，以用户自己说舒服或有用为准。
  request_phrases:
  - 呼吸练习
  - 留意自然呼吸
