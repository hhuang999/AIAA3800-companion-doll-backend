id: grounding
name: 看看身边的一样东西
status: enabled
emo: 😌
lines:
- text: 如果你周围这会儿觉得踏实，先把视线落到身边一样普通的东西上。
  pause_s: 3
- text: 只留意它的一种颜色或纹理，不用急着回答我。
  pause_s: 4
- text: 再轻轻感觉一下脚底踩着地面，或者椅子托住背的感觉，不舒服就跳过。
  pause_s: 4
- text: 也不用逼自己立刻静下来，我们先歇这一小会儿就好。
  pause_s: 0
protocol:
  version: course-2.0
  goal: 借助当下视野与触觉支持把紧绷思绪暂时落回到安全现实环境
  evidence_ids:
  - E13
  prerequisites:
  - 所处环境安全，能自由看一看手边日常物件
  - 愿意尝试短暂外部感官着陆
  excluded_contexts:
  - unsafe_relationship
  invitation: 要不要花半分钟看看手边一样普通物件，把紧绷的念头稍微拉回眼前？不舒服随时停。
  stop: 拒绝、中断、新输入或风险接管立即取消。
  feedback_limits: 仅根据用户主观反馈记录是否受用，不从播完本身推断缓解。
  request_phrases:
  - 看看周围
  - 外部注意练习
  - 定位练习
