replies:
  opening: 我在呢，今天想聊什么？
  explore: 听起来这件事让你很在意。后来发生了什么？
  comfort: 这样的时候觉得难受，是可以理解的。我在听。
  permission: 我们可以慢慢来。
  action: 那天具体是怎么发生的？
  closing: 今天先聊到这里，好好休息。
  quiet: 好，我在这里陪着你。
summary: '[开发夹具摘要：此会话已结束，真实内容由在线 Reasoner 提取。]'
strategy_replies:
  S16: [先只看刚才卡住的那个片段。, 哪一小部分是你能影响的？, 这一步也可以先留着，不用马上决定。]
  concrete_step: [先只看刚才卡住的那个片段。, 哪一小部分是你能影响的？, 这一步也可以先留着，不用马上决定。]
  exam_steadying: [考前心跳快其实是在帮你提神，不代表你没准备好。, 先挑一个进考场后最稳的起手动作好不好？, 这股节奏放在你自己手里就行。]
  kind_self_talk: [一次没做好和整个人不行，是两回事。, 对朋友说的话会不会温和一些？, 先保留你觉得准确的说法就好。]
  comparison_reframe: [盯着榜单看确实容易觉得掉队，先把那张名次表放一边。, 这周你自己哪一块比两周前稳了一点？, 不用跟同桌拿同一把尺子量。]
  expectation_boundary: [听见家里拿分数和亲戚比，换谁心里都堵。, 爸妈的焦急是他们的担心，你今晚的步调还得你自己定。, 今天先不跟家里争，先把这十分钟守好。]
  safe_communication: [既然对方相对安全，先顺一句平实好开口的话。, 我昨天没看手机让你久等了，今晚方便再聊聊吗？, 这句话发不发全听你自己的。]
  safe_support: [担心被评价和传出去，本来就会让人不敢开口。, 我们只挑一个你觉得相对放心的人或校内心理老师。, 先留一句只说两成的轻量开头，也可以今天先不找人。]
  values_exploration: [现在不用决定一辈子的方向。, 可以只留一个你有点好奇的小问题。, 这条信息先留着和可信的人核实。]
  worry_parking: [这件担心可以先留在这里。, 今晚不用把它解决完，好好歇会儿。]
