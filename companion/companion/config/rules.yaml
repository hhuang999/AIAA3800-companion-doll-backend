speech: 用简短自然的中文，每轮最多三句，每句约二十五字。一次最多一个问题，不列点，不说检测到情绪，不提供医疗或政策建议。
emojis:
  allowed: [😶, 🙂, 😔, 😌, 🤔, 😰]
  default: 😶
transitions:
  ask: [怎么办, 有什么办法, 我该怎么做, 教教我, 想要.*办法, 能帮我想想吗, 怎么应对, 怎么稳住, 怎么调]
  agree:
    - '^(?!.*(?:难受|算了|不用|不想|不要|不愿|不行|不可以|没用))(?:那)?(?:好|好的|好呀|好啊|嗯|嗯嗯|可以|可以呀|可以啊|行|行吧|行啊|行呀|想听|愿意|说吧|试试)(?:[，, ]*(?:你说|说吧|试试|试试看|继续|我愿意|你讲讲看|讲讲看|说说看|那我听听|我听听|听听看))*[。！!，, ]*$'
  refuse:
    - 不用
    - 先不
    - 算了
    - 不可以
    - '(?<!愿)不愿意'
    - '不(想要|要|想听).{0,4}(办法|建议)'
    - 只想说说
    - 只是想说说
    - 不想试
    - 不想做
    - 不太想试
    - 我想接着说
    - 停下来
    - 停一下
    - 先停下
    - 没用
    - '不(?:想|太想|打算)?继续'
    - '不(?:想)?(?:做|练|试)了'
  quiet: [不想说, 不想聊, 别问了, 先停在这里, 今天就到这里, 今天就到这儿, 今天先到这儿, 先到这儿, 今晚就歇, 就歇这儿, 先歇这儿, 先聊到这里, 让我静静, 我想先静静]
  correct: [不是这样, 你说错了, 你理解错了, 不对]
  change_topic: [换个话题, 说另一件事, 先不说这个, 聊点别的]
output_rail:
  cliche:
    - 想开点
    - 别想太多
    - 至少你还
    - 你一定行
    - 你已经做得很好了
    - '你已经.{0,6}(努力|尽力)'
    - 一切都会好的
    - 加油你一定
    - 要学会放下
    - 换个角度想想
    - 这点挫折算什么
  lecture: [你应该, 你必须]
  appearance: [你不胖, 你长得]
  medical: [诊断为, 抑郁症的药, 服用.*药, 录取分数, 选科组合推荐]
  intimate: [我爱你, 只有我懂你, 永远只属于你]
  advice: [试试, 建议你, 你最好, 你试过, 不妨, 试着把]
  guarantee: [不会让对方觉得, 保证.*(成功|好起来|不会)]
