<rect x="48" y="492" width="540" height="218" rx="6" fill="#FFFFFF" stroke="#AEB3AA" stroke-width="1.4"/>
<text x="64" y="518" class="t-code-sig">COLLOQUIAL NEGATIVE-LOOKAHEAD &amp; SCOPED BOUNDARIES</text>
<text x="64" y="548" class="t-h" font-size="11.5">• Lookahead Agree Regex</text>
<text x="76" y="564" class="t-m">Accepts &#x27;ok tell me&#x27;; blocks &#x27;not that I don&#x27;t want&#x27; or &#x27;no thanks&#x27;.</text>
<text x="64" y="590" class="t-h" font-size="11.5">• Lookahead Future Probe</text>
<text x="76" y="606" class="t-m">Allows &#x27;curious about subjects&#x27; while blocking premature lock-in.</text>
<text x="64" y="632" class="t-h" font-size="11.5">• Scoped Topic / Advice Ban</text>
<text x="76" y="648" class="t-m">Blocks banned exam/grade probes without blocking bedtime soothing.</text>
<text x="64" y="674" class="t-h" font-size="11.5">• Correction vs Clarification</text>
<text x="76" y="690" class="t-m">&#x27;You misremembered my name&#x27; supersedes old label cleanly.</text>
<rect x="612" y="492" width="540" height="218" rx="6" fill="#252C27" stroke="#242824" stroke-width="1.4"/>
<text x="630" y="518" class="t-code-w">SAFETY, LIFECYCLE INVARIANTS &amp; WAKE LOGIC</text>
<text x="630" y="548" class="t-code-w">Silent Crisis Lane Isolation</text>
<text x="642" y="564" class="t-m-w" font-size="10.5">Lexicon + async qwen-flash; sticky crisis takeover overrides cards.</text>
<text x="630" y="590" class="t-code-w">Monotonic generation Counter</text>
<text x="642" y="606" class="t-m-w" font-size="10.5">Any turn, barge-in, or high risk increments generation &amp; drops TTS.</text>
<text x="630" y="632" class="t-code-w">Dual Plan ID Separation</text>
<text x="642" y="648" class="t-m-w" font-size="10.5">active_plan_id tracks exercises; active_support_plan_id holds strategy.</text>
<text x="630" y="674" class="t-code-w">resolve_opening() Reconnect</text>
<text x="642" y="690" class="t-m-w" font-size="10.5">Queries SQLite prior user turns to skip redundant onboarding on wake.</text>
