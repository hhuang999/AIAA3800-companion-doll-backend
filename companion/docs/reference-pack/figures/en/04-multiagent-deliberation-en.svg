<text x="300" y="168" class="t-h">qwen-flash · Independent</text>
<text x="300" y="190" class="t-m">Runs parallel to Analysis/Catalog</text>
<text x="300" y="208" class="t-m">Surfaces counter_evidence risks</text>
<rect x="284" y="242" width="228" height="102" rx="6" fill="#EFEAE0" stroke="#242824" stroke-width="1.4"/>
<text x="298" y="268" class="t-code">Context Analysis</text>
