  <text x="1152" y="38" text-anchor="end" class="t-sub">Brief // Analysis (gpt-4.1-mini) -&gt; Catalog -&gt; Planner -&gt; Cross-Family Critic (qwen-flash)</text>
  <text x="48" y="68" class="t-title">Fair Scheduling, Blind Brief, Catalog Filtering, Fast-Path &amp; Cross-Family Critic</text>
  <rect x="48" y="120" width="198" height="224" rx="6" fill="#FFFFFF" stroke="#242824" stroke-width="1.4"/>
<text x="64" y="148" class="t-code-sig">SCHEDULER QUEUE</text>
<text x="64" y="172" class="t-h">Per-User Serial · Fair</text>
<text x="64" y="200" class="t-b">Priority Routing:</text>
<text x="64" y="222" class="t-code">• repair (refusal/fix)</text>
<text x="64" y="244" class="t-code">• deliberation (help/ask)</text>
<text x="64" y="266" class="t-code">• end_consolidation</text>
<text x="64" y="294" class="t-m">Suppresses duplicate watch</text>
<text x="64" y="316" class="t-m">Cap: 8 calls / 20s deadline</text>
