<text x="298" y="312" class="t-m">Grounded in user_turn evidence</text>
<text x="298" y="330" class="t-m">Scores intensity, readiness &amp; need</text>
<line x1="512" y1="171" x2="546" y2="215" stroke="#242824" stroke-width="1.4" marker-end="url(#arr)"/>
