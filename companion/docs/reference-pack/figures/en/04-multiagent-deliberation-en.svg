<text x="568" y="148" class="t-code">DETERMINISTIC CATALOG</text>
<text x="568" y="172" class="t-h">Zero-LLM Pre-Qualification</text>
<text x="568" y="202" class="t-b">• status == enabled</text>
<text x="568" y="226" class="t-b">• Session refusal / limit free</text>
<text x="568" y="250" class="t-b">• Readiness &amp; intensity match</text>
<text x="568" y="274" class="t-b">• Required / excluded contexts</text>
<text x="568" y="298" class="t-b">• Scoped no_advice exclusion</text>
<text x="568" y="324" class="t-code-sig">-&gt; Small qualified subset only</text>
<line x1="784" y1="232" x2="818" y2="232" stroke="#242824" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="824" y="120" width="328" height="224" rx="6" fill="#FFFFFF" stroke="#242824" stroke-width="1.5"/>
<text x="842" y="148" class="t-code">PLANNER (gpt-4.1-mini)</text>
<text x="842" y="172" class="t-h">Compact-Contract Policy Plan</text>
<text x="842" y="202" class="t-b">1. Select L1 mode or invite_action/exercise</text>
<text x="842" y="226" class="t-b">2. Attach turn-ID evidence per card</text>
<text x="842" y="250" class="t-b">3. Draft 2-3 colloquial response_guidance</text>
<text x="842" y="274" class="t-b">4. Emit avoid bounds &amp; question budget</text>
<text x="842" y="302" class="t-code-sig">Compact contract (not full JSON Schema)</text>
<text x="842" y="324" class="t-m">Lower prompt overhead &amp; fewer repairs</text>
<line x1="900" y1="344" x2="320" y2="394" stroke="#3B5246" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="1020" y1="344" x2="860" y2="394" stroke="#BF471B" stroke-width="1.8" marker-end="url(#arr-sig)"/>
<rect x="48" y="398" width="536" height="232" rx="6" fill="#E3E7DC" stroke="#3B5246" stroke-width="1.5"/>
<text x="68" y="426" class="t-code">PATH A · ADAPTIVE FAST-PATH (fast_path_non_action)</text>
<text x="68" y="452" class="t-h">Pure Empathy Bypass (Skips Brief Drain &amp; Critic)</text>
<text x="68" y="480" class="t-b">Triggered ONLY when ALL invariants hold on version 1:</text>
<text x="68" y="504" class="t-code">• objective in NON_ACTION (attuned_listen, tentative_reflect,</text>
<text x="68" y="523" class="t-code">  low_energy_companionship, quiet_presence, listen/comfort...)</text>
<text x="68" y="547" class="t-code">• candidate_actions == [] AND local_issues == []</text>
<text x="68" y="571" class="t-code">• not protects_active_offer (no approved permission offer active)</text>
<text x="68" y="604" class="t-m">-&gt; Halves background hops on routine venting without overwriting consent state.</text>
<rect x="616" y="398" width="536" height="232" rx="6" fill="#FBECE6" stroke="#BF471B" stroke-width="1.5"/>
<text x="636" y="428" class="t-code-sig">PATH B · CROSS-FAMILY PEER REVIEW (critic = qwen-flash)</text>
<text x="636" y="454" class="t-h-sig">Heterogeneous Critic &amp; Single-Revision Loop</text>
<text x="636" y="484" class="t-b">Mandatory whenever actions, exercises, or active offers are involved:</text>
<text x="636" y="508" class="t-b">• Audits Planner candidate against Blind Brief &amp; user_turn evidence</text>
<text x="636" y="532" class="t-b">• Uses distinct model family (qwen-flash vs gpt-4.1-mini Planner)</text>
<text x="636" y="556" class="t-b">• Rejection triggers at most 1 targeted revision (version 1 -&gt; 2)</text>
<text x="636" y="592" class="t-code-sig">-&gt; Proceeds to DeltaGuard &amp; Quadruple CAS Publication Gate.</text>
