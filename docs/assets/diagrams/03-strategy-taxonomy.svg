<rect x="48" y="600" width="1104" height="68" rx="6" fill="#252C27" stroke="#242824" stroke-width="1.4"/>
<text x="68" y="628" class="t-h-w">独立静默安全底层通道（与日常策略池正交隔离）</text>
<text x="68" y="650" class="t-m-w">高危安全识别由确定性词表与并发分类器静默保护，仅在明确风险规则触发时接管输出权限，日常升学倾诉与陪伴不受干扰。</text>
