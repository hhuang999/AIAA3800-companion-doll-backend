  <text x="48" y="38" class="t-kicker">DIAGRAM 03 · CAPABILITY TAXONOMY</text>
  <text x="1152" y="38" text-anchor="end" class="t-sub">L1 Non-Action Presence + L2 Consented Micro-Strategies &amp; Exercises</text>
  <text x="48" y="68" class="t-title">分层陪伴能力全景图：主动共情四态、单步许可门、九张支持策略卡与三段短练习</text>
  <text x="48" y="118" class="t-code">TIER 1 · 默认主动共情（无需许可）</text>
<text x="364" y="118" class="t-code-sig">CONSENT GATE · 许可与边界闸</text>
<text x="646" y="118" class="t-code">TIER 2 · 经单步许可开启的微策略与短练习</text>
<rect x="48" y="134" width="280" height="444" rx="6" fill="#E3E7DC" stroke="#3B5246" stroke-width="1.4"/>
<text x="66" y="162" class="t-h">L1 主动共情四态矩阵</text>
<text x="66" y="182" class="t-m">日常倾诉默认停驻层，绝不抢推任务</text>
<rect x="64" y="202" width="248" height="76" rx="5" fill="#FFFFFF" stroke="#D5D8D0" stroke-width="1.2"/>
<text x="76" y="223" class="t-code-sig">attuned_listen</text>
<text x="76" y="243" class="t-h">贴近原话接住委屈</text>
<text x="76" y="262" class="t-m">紧扣刚才细节回应，零说教少追问</text>
<rect x="64" y="292" width="248" height="76" rx="5" fill="#FFFFFF" stroke="#D5D8D0" stroke-width="1.2"/>
<text x="76" y="313" class="t-code-sig">tentative_reflect</text>
<text x="76" y="333" class="t-h">可纠正的试探反映</text>
<text x="76" y="352" class="t-m">轻声尝试命名夹心情绪，留纠偏余地</text>
<rect x="64" y="382" width="248" height="76" rx="5" fill="#FFFFFF" stroke="#D5D8D0" stroke-width="1.2"/>
<text x="76" y="403" class="t-code-sig">low_energy_companionship</text>
<text x="76" y="423" class="t-h">晚归低能量去内疚</text>
<text x="76" y="442" class="t-m">极度疲惫时正常化休息，严禁安排任务</text>
<rect x="64" y="472" width="248" height="76" rx="5" fill="#FFFFFF" stroke="#D5D8D0" stroke-width="1.2"/>
<text x="76" y="493" class="t-code-sig">quiet_presence</text>
<text x="76" y="513" class="t-h">安静无负担在场</text>
<text x="76" y="532" class="t-m">响应“让我静静”，简短陪伴零提问</text>
<line x1="328" y1="350" x2="358" y2="350" stroke="#242824" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="364" y="134" width="244" height="444" rx="6" fill="#FBECE6" stroke="#BF471B" stroke-width="1.5"/>
<text x="382" y="164" class="t-h-sig">单步许可与作用域隔离</text>
<rect x="378" y="190" width="216" height="80" rx="5" fill="#FFFFFF" stroke="#E8B5A2" stroke-width="1.2"/>
<text x="390" y="211" class="t-h">1. 显式求助或适度开放</text>
<text x="390" y="232" class="t-m">仅在 ask_for_help 或 readiness</text>
<text x="390" y="250" class="t-m">非低状态时进入候选遴选</text>
<rect x="378" y="284" width="216" height="80" rx="5" fill="#FFFFFF" stroke="#E8B5A2" stroke-width="1.2"/>
<text x="390" y="305" class="t-h">2. Catalog 资格与排除过滤</text>
<text x="390" y="326" class="t-m">校验情绪强度、上下文条件、</text>
<text x="390" y="344" class="t-m">unsafe_relationship 与会话拒绝集</text>
<rect x="378" y="378" width="216" height="80" rx="5" fill="#FFFFFF" stroke="#E8B5A2" stroke-width="1.2"/>
<text x="390" y="399" class="t-h">3. 一次单步情境化邀请</text>
<text x="390" y="420" class="t-m">激活 PendingOffer(target_id)，</text>
<text x="390" y="438" class="t-m">仅邀请一项，不列候选菜单</text>
<rect x="378" y="472" width="216" height="80" rx="5" fill="#FFFFFF" stroke="#E8B5A2" stroke-width="1.2"/>
<text x="390" y="493" class="t-h">4. 明确 agree 方解锁执行</text>
<text x="390" y="514" class="t-m">拒绝 / 静静 / 换题即刻归零，</text>
<text x="390" y="532" class="t-m">聚焦 &lt;= 3 轮，不连推同类卡片</text>
